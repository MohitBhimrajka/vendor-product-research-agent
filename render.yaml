services:
  - type: web
    name: vendor-product-research-agent # Updated name
    env: python
    buildCommand: pip install -r requirements.txt
    # Ensure app.py is the entry point for Streamlit
    startCommand: streamlit run app.py --server.port=$PORT --server.address=0.0.0.0
    envVars:
      - key: GEMINI_API_KEY
        sync: false # Keep API key secure